# cargo-about: the licences of every crate linked into speak, written to licenses/THIRD-PARTY.md
# in each release archive by scripts/package.sh. Earlier entries are preferred for dual licences.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "WTFPL",
]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# misaki-rs's language-tokenizer sets no `license` field; its LICENSE.md is the WTFPL.
[language-tokenizer.clarify]
license = "WTFPL"

[[language-tokenizer.clarify.files]]
path = "LICENSE.md"
license = "WTFPL"
checksum = "971408c19bfdfcf3934b2be00951157b1c95690b8d86a731d0001f4e75a54619"
