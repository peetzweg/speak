[package]
name = "speak"
version = "0.0.1"
edition = "2024"
description = "Spike: say(1)-compatible CLI on local Kokoro-82M (Rust)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# ONNX Runtime. `download-binaries` fetches pyke's prebuilt *static* onnxruntime at build time
# and links it into the binary (no runtime dylib). TLS only matters for that build-time download.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-24"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
crossterm = "0.29"
clap = { version = "4.6", features = ["derive"] }
regex = "1"
zip = { version = "9", default-features = false }
anyhow = "1"

[features]
default = []
# Link libespeak-ng 1.52.0 statically (built from source by build.rs after scripts/fetch-espeak.sh).
# Makes the binary GPL-3.0; the default build runs the `espeak-ng` program as a subprocess instead.
espeak-inprocess = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
