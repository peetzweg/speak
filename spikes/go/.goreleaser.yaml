# Sketch only (spike): how speak would ship with the cgo-free (purego) build.
# Validated with `goreleaser check`; not run as a release.
version: 2
project_name: speak
builds:
  - id: speak
    main: ./cmd/speak
    binary: speak
    env: [CGO_ENABLED=0]          # purego: every target cross-compiles from one runner
    tags: [purego]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [darwin, linux]          # windows: blocked until the purego ORT binding loads DLLs
    goarch: [amd64, arm64]
archives:
  - id: speak
    formats: [tar.gz]
    name_template: "speak_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]   # no onnxruntime, no espeak-ng: those come from the OS
checksum:
  name_template: checksums.txt
brews:
  - name: speak
    repository: { owner: peetzweg, name: homebrew-tap }
    homepage: https://github.com/peetzweg/speak
    description: say(1)-compatible local neural text-to-speech
    license: Apache-2.0
    dependencies:
      - name: onnxruntime   # homebrew-core, MIT; bottles: arm64 macOS + Linux (no Intel macOS)
      - name: espeak-ng     # homebrew-core, GPL-3.0-or-later; run as a separate program
    install: |
      bin.install "speak"
    test: |
      system "#{bin}/speak", "--help"
